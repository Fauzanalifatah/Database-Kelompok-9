
services:
  db:
    image: mariadb:10.11.15
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: db_losarikomputer
      MYSQL_USER: losarikomputer_user
      MYSQL_PASSWORD: losarikomputer_pass
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${MYSQL_HOST_PORT:-3312}:3306"
    networks:
      - losarikomputer_network

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "${PHPMYADMIN_HOST_PORT:-8890}:80"
    networks:
      - losarikomputer_network

volumes:
  db_data:

networks:
  losarikomputer_network:
    driver: bridge
