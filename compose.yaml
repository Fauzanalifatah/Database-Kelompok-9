
services:
  db:
    image: mariadb:10.11.15
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: db_storethesis
      MYSQL_USER: thesistore_user
      MYSQL_PASSWORD: thesistore_pass
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${MYSQL_HOST_PORT:-3311}:3306"
    networks:
      - thesistore_network

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "${PHPMYADMIN_HOST_PORT:-8889}:80"
    networks:
      - thesistore_network

volumes:
  db_data:

networks:
  thesistore_network:
    driver: bridge
